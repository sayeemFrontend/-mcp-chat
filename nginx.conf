server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Embeddable scripts, loaded cross-origin by customer sites. Unversioned URLs get a short cache so fixes
    # roll out quickly; /v1/ is the same file for sites that want to pin the major version.
    location ~ ^/(v1/)?(widget|embed)\.js$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /$2.js =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
